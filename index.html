<!DOCTYPE html>

<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەشی داخڵبوون</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="login-title">بەشی داخڵبوون</h1>

```
<div class="logo-container">
    <img src="logo.png" alt="لۆگۆ" class="logo" id="logo">
</div>

<div class="login-box">
    <form id="loginForm">
        <div class="input-group">
            <span class="input-icon">👤</span>
            <label class="input-label">ناوی بەکارهێنەر</label>
            <input type="text" id="username" required autocomplete="off">
        </div>

        <div class="input-group">
            <span class="input-icon">🔒</span>
            <label class="input-label">وشەی نهێنی</label>
            <input type="password" id="password" required autocomplete="off">
        </div>

        <button type="submit" class="login-btn" id="submitBtn">چوونەژوورەوە</button>
        
        <div class="message" id="message"></div>
    </form>
</div>

<script src="script.js"></script>
```

</body>
</html>
